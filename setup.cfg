[metadata]
name = dynamic_reality_model
version = 0.0.1 #0.0.1
author = Jelle Vermandere
description = Dynamic Reality Modeling is a Package that combines SOA works into one complete workflow to generate Complete and dynamic 3D scenes from partial scans and/ or RGB-D images
long_description = file: README.md
long_description_content_type = text/markdown
url = #url
License = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9 # list the compatible python versions
install_requires =
    numpy # list all the dependencies